name: Build e Deploy GLOT

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/glot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/glot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy via API do Portainer
        run: |
          # Busca os dados atuais da stack (id=48, endpointId=1)
          STACK=$(curl -s \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            "${{ secrets.PORTAINER_URL }}/api/stacks/48")

          ENV_VARS=$(echo $STACK | python3 -c \
            "import sys,json; print(json.dumps(json.load(sys.stdin).get('Env', [])))")

          STACK_FILE=$(echo $STACK | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('StackFileContent', ''))")

          STACK_FILE_JSON=$(echo "$STACK_FILE" | python3 -c \
            "import sys,json; print(json.dumps(sys.stdin.read()))")

          # Dispara o redeploy com pull da nova imagem
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.PORTAINER_URL }}/api/stacks/48?endpointId=1" \
            -d "{
              \"stackFileContent\": $STACK_FILE_JSON,
              \"env\": $ENV_VARS,
              \"pullImage\": true
            }")

          echo "Status da resposta: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Deploy realizado com sucesso!"
          else
            echo "❌ Erro no deploy. Status: $RESPONSE"
            exit 1
          fi