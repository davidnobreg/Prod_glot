{% extends 'base.html' %}
{% load static %}

{% block title %}Gerar Carnê{% endblock %}

{% block content %}
    <div class="card m-3" style="max-width: 520px;">
        <div class="card-header">
            <h5 class="mb-0">Gerar Carnê — {{ venda.cliente.name }}</h5>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Número de parcelas (1-12)</label>
                    <input type="number" name="numero_parcelas" min="1" max="12" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Valor da parcela</label>
                    <input type="text" name="valor_parcela" class="form-control" placeholder="0,00" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Data da primeira parcela</label>
                    <input type="date" name="data_primeira_parcela" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ano de referência</label>
                    <input type="number" name="ano_referencia" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Modalidade</label>
                    <select name="modalidade" class="form-select">
                        {% for valor, label in modalidade_choices %}
                            <option value="{{ valor }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <a href="{% url 'lista_carnes_venda' venda.uuid %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Gerar Carnê</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
