{% extends 'base.html' %}
{% load static %}

{% block title %}Gerar Entrada{% endblock %}

{% block content %}
    <div class="card m-3" style="max-width: 520px;">
        <div class="card-header">
            <h5 class="mb-0">Gerar Entrada — {{ venda.cliente.name }}</h5>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Valor Total da Entrada</label>
                    <input type="text" id="id_valor" name="valor" class="form-control" placeholder="0,00" value="{{ initial.valor|default:'' }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantidade de parcelas (1-12)</label>
                    <input type="number" id="id_quantidade_parcelas" name="quantidade_parcelas" min="1" max="12" class="form-control" value="{{ initial.quantidade_parcelas|default:1 }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Data da 1ª parcela</label>
                    <input type="date" name="data_vencimento" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Modalidade</label>
                    <select name="modalidade" class="form-select">
                        {% for valor, label in modalidade_choices %}
                            <option value="{{ valor }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3 text-muted" id="preview_parcela"></div>

                <div class="d-flex gap-2">
                    <a href="{% url 'lista_carnes_venda' venda.uuid %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Gerar Entrada</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function () {
            var valorInput = document.getElementById('id_valor');
            var qtdInput = document.getElementById('id_quantidade_parcelas');
            var preview = document.getElementById('preview_parcela');

            function atualizarPreview() {
                var valor = parseFloat((valorInput.value || '0').replace(',', '.'));
                var qtd = parseInt(qtdInput.value, 10);
                if (!valor || !qtd || qtd < 1) {
                    preview.textContent = '';
                    return;
                }
                var valorParcela = valor / qtd;
                preview.textContent = 'Valor de cada parcela: R$ ' + valorParcela.toFixed(2).replace('.', ',');
            }

            valorInput.addEventListener('input', atualizarPreview);
            qtdInput.addEventListener('input', atualizarPreview);
            atualizarPreview();
        })();
    </script>
{% endblock %}
