beat:
image: davidnobrega/glot:latest

```
command: >
  /bin/sh -c "
  sleep 15 &&
  celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
  "

volumes:
  - configuration:/app/configuration
  - logs:/app/logs
  - celerybeat:/app/celerybeat

networks:
  - app_network

depends_on:
  - worker_empreendimentos
  - rabbitmq
  - web

deploy:
  mode: replicated
  replicas: 1
