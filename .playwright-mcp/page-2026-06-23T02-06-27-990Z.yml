- generic [ref=e2]: "// static/js/telefone.js document.addEventListener(\"DOMContentLoaded\", function () { // se vier do backend, usa; senão inicia vazio window.telefonesTemp = Array.isArray(window.telefonesTemp) ? window.telefonesTemp : []; // =============================== // MENSAGEM DE ERRO // =============================== function mostrarErro(msg) { let box = document.getElementById(\"telefoneErro\"); if (!box) { box = document.createElement(\"div\"); box.id = \"telefoneErro\"; box.className = \"tw:mt-2 tw:rounded-xl tw:bg-red-50 tw:text-red-700 tw:px-4 tw:py-2 tw:text-sm\"; const formRow = document.querySelector(\"#telefoneNumero\")?.parentNode; if (formRow) formRow.appendChild(box); } box.innerText = msg; box.style.display = \"block\"; } function limparErro() { const box = document.getElementById(\"telefoneErro\"); if (box) box.style.display = \"none\"; } // =============================== // VALIDA TELEFONE BR // =============================== function telefoneValido(numero) { const regex = /^(\\(?\\d{2}\\)?\\s?)?(\\d{4,5})[- ]?(\\d{4})$/; return regex.test(numero); } // =============================== // ADICIONAR // =============================== window.addTelefone = function () { limparErro(); const input = document.getElementById(\"telefoneNumero\"); if (!input) return; const numero = input.value.trim(); if (!numero) { mostrarErro(\"Digite um número de telefone.\"); return; } if (!telefoneValido(numero)) { mostrarErro(\"Telefone inválido.\"); return; } const normalizado = numero.replace(/\\D/g, \"\"); const existe = window.telefonesTemp.some(t => t.replace(/\\D/g, \"\") === normalizado ); if (existe) { mostrarErro(\"Este telefone já foi adicionado.\"); return; } window.telefonesTemp.push(numero); atualizarLista(); input.value = \"\"; }; // =============================== // LISTAR // =============================== window.atualizarLista = function () { const container = document.getElementById(\"listaTelefones\"); if (!container) return; container.innerHTML = \"\"; if (!window.telefonesTemp.length) { const empty = document.createElement(\"div\"); empty.className = \"tw:rounded-xl tw:border tw:border-dashed tw:border-slate-700 tw:bg-slate-950/40 tw:p-4 tw:text-sm tw:text-slate-400\"; empty.textContent = \"Nenhum telefone adicionado.\"; container.appendChild(empty); } else { window.telefonesTemp.forEach((tel, index) => { const row = document.createElement(\"div\"); row.className = \"tw:flex tw:items-center tw:justify-between tw:gap-5 tw:rounded-xl tw:border tw:border-slate-200 tw:bg-white tw:px-4 tw:py-2\"; row.innerHTML = ` <div class=\"tw:flex tw:flex-col tw:min-w-0\"> <span class=\"tw:font-semibold tw:text-slate-900\">${tel}</span> </div> <button type=\"button\" class=\"tw:inline-flex tw:items-center tw:justify-center tw:rounded-xl tw:px-4 tw:py-2 tw:font-semibold tw:text-white tw:bg-red-600 tw:transition\" onclick=\"removerTelefone(${index})\" aria-label=\"Remover telefone\"> <i class=\"fas fa-trash\"></i> </button> `; container.appendChild(row); }); } const hidden = document.getElementById(\"telefones_json\"); if (hidden) hidden.value = JSON.stringify(window.telefonesTemp); }; // =============================== // REMOVER // =============================== window.removerTelefone = function (index) { window.telefonesTemp.splice(index, 1); atualizarLista(); }; // =============================== // FECHAR MODAL (se usado) // =============================== window.fecharModal = function () { const modalEl = document.getElementById(\"modalTelefones\"); if (!modalEl || !window.bootstrap) return; const instance = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl); instance.hide(); }; atualizarLista(); });"