name: Build e Deploy GLOT

on:
push:
branches:
- main

jobs:
build-and-deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout do código
    uses: actions/checkout@v4

  - name: Configurar Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Login no Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Build e push da imagem
    uses: docker/build-push-action@v5
    with:
      context: .
      push: true
      platforms: linux/amd64
      tags: |
        ${{ secrets.DOCKERHUB_USERNAME }}/glot:latest
        ${{ secrets.DOCKERHUB_USERNAME }}/glot:${{ github.sha }}
      cache-from: type=gha
      cache-to: type=gha,mode=max
      build-args: |
        GIT_COMMIT=${{ github.sha }}

  - name: Redeploy via API do Portainer
    env:
      GIT_COMMIT: ${{ github.sha }}
      PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    run: |
      set -e

      echo "Obtendo docker-compose da stack..."

      STACK_FILE=$(curl -s \
        -H "X-API-Key: $PORTAINER_TOKEN" \
        "$PORTAINER_URL/api/stacks/48/file" \
        | python3 -c "import sys,json; print(json.load(sys.stdin)['StackFileContent'])")

      STACK_FILE_JSON=$(echo "$STACK_FILE" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

      echo "Atualizando stack..."

      RESPONSE=$(curl -s -o /tmp/portainer_response.json -w "%{http_code}" -X PUT \
        -H "X-API-Key: $PORTAINER_TOKEN" \
        -H "Content-Type: application/json" \
        "$PORTAINER_URL/api/stacks/48?endpointId=1" \
        -d "{\"stackFileContent\": $STACK_FILE_JSON, \"env\": [{\"name\": \"GIT_COMMIT\", \"value\": \"$GIT_COMMIT\"}, {\"name\": \"SENTRY_DSN\", \"value\": \"$SENTRY_DSN\"}], \"pullImage\": true, \"prune\": true}")

      echo "Status PUT stack: $RESPONSE"

      if [ "$RESPONSE" != "200" ]; then
        echo "Erro ao atualizar stack"
        cat /tmp/portainer_response.json
        exit 1
      fi

      echo "Aguardando Portainer atualizar a stack..."
      sleep 20

      echo "Obtendo lista de serviços..."
      ALL_SERVICES=$(curl -s \
        -H "X-API-Key: $PORTAINER_TOKEN" \
        "$PORTAINER_URL/api/endpoints/1/docker/services")

      for SERVICE in web worker_empreendimentos worker_mensagens beat flower; do
        SERVICE_NAME="django_glot_$SERVICE"
        echo "Reiniciando: $SERVICE_NAME"

        SERVICE_ID=$(echo "$ALL_SERVICES" | python3 -c "import sys,json; services=json.load(sys.stdin); print(next((s.get('ID','') for s in services if s.get('Spec',{}).get('Name','') == '$SERVICE_NAME'), ''))")

        if [ -z "$SERVICE_ID" ]; then
          echo "Servico $SERVICE_NAME nao encontrado, pulando..."
          continue
        fi

        SERVICE_SPEC=$(curl -s \
          -H "X-API-Key: $PORTAINER_TOKEN" \
          "$PORTAINER_URL/api/endpoints/1/docker/services/$SERVICE_ID")

        VERSION=$(echo "$SERVICE_SPEC" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('Version',{}).get('Index',''))")

        if [ -z "$VERSION" ]; then
          echo "Nao foi possivel obter a versao do servico $SERVICE_NAME"
          echo "$SERVICE_SPEC"
          continue
        fi

        SPEC=$(echo "$SERVICE_SPEC" | python3 -c "import sys,json; data=json.load(sys.stdin); spec=data['Spec']; spec.setdefault('TaskTemplate', {}); spec['TaskTemplate']['ForceUpdate'] = spec['TaskTemplate'].get('ForceUpdate', 0) + 1; print(json.dumps(spec))")

        UPDATE=$(curl -s -o /tmp/service_update_response.json -w "%{http_code}" -X POST \
          -H "X-API-Key: $PORTAINER_TOKEN" \
          -H "Content-Type: application/json" \
          "$PORTAINER_URL/api/endpoints/1/docker/services/$SERVICE_ID/update?version=$VERSION" \
          -d "$SPEC")

        echo "Status $SERVICE_NAME: $UPDATE"

        if [ "$UPDATE" != "200" ]; then
          echo "Falha ao atualizar $SERVICE_NAME"
          cat /tmp/service_update_response.json
        fi
      done

      echo "Deploy concluido!"
