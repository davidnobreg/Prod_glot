{% extends 'base.html' %}
{% load static %}

{% block title %}
    Login
{% endblock %}

{% block content %}
    <div class="container-fluid mt-4">
        <div class="row align-items-center justify-content-center g-4">

            <div class="col-lg-6">
                <div class="card text-center">
                    <div class="card-header">
                        <h4 class="mb-3">ENTRAR NA CONTA</h4>
                    </div>

                    <div class="card-body mb-3">
                        <form action="{% url 'login' %}" method="POST" class="card p-4 shadow align-items-center">
                            {% csrf_token %}

                            {{ form.non_field_errors }}

                            <div class="form-floating mb-3 w-100">
                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    id="id_email"
                                    placeholder="name@example.com"
                                    required
                                >
                                <label for="id_email">Digite seu email</label>
                            </div>

                            <div class="form-floating mb-3 w-100">
                                <input
                                    type="password"
                                    name="senha"
                                    class="form-control"
                                    id="id_senha"
                                    placeholder="Digite sua senha"
                                    required
                                >
                                <label for="id_senha">Digite sua senha</label>
                            </div>

                            <div class="form-floating mb-3">
                                <button type="submit" class="btn btn-primary px-4 py-2 rounded-pill">
                                    Logar
                                </button>
                            </div>

                            <!--
                            <div class="form-floating mb-3">
                                <a href="criar-cadastro" class="navbar-brand">
                                    <p>Crie a sua conta</p>
                                </a>
                            </div>
                            -->
                        </form>
                    </div>
                </div>
            </div>

            <!--<div class="col-lg-6">
                <div class="card text-center">
                    <div class="card-header">
                        <h4 class="mb-3">EM CONSTRUÇÃO</h4>
                    </div>

                    <div class="card-body mb-3">
                        <div class="p-4 bg-slate-100 rounded-xl shadow text-slate-800">
                            Tailwind CSS carregado com sucesso no GLOT.
                        </div>
                    </div>
                </div>
            </div>-->

        </div>
    </div>
{% endblock %}
