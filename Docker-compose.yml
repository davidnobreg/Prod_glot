version: "3.9"

services:
  web:
    image: davidnobrega/glot:latest

    ports:
      - "8000:8000"

    environment:
      - SENTRY_DSN=${SENTRY_DSN}
      - ENVIRONMENT=production
      - GIT_COMMIT=${GIT_COMMIT}
      - RUN_MIGRATIONS=true

    volumes:
      - configuration:/app/configuration
      - logs:/app/logs
      - media_compartilhada:/app/media
      - static_volume:/app/static

    networks:
      - app_network
      - npm_public

    depends_on:
      - postgres
      - rabbitmq

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  worker_empreendimentos:
    image: davidnobrega/glot:latest

    command: celery -A core worker -Q empreendimentos,clientes -l info --pool=prefork

    volumes:
      - configuration:/app/configuration
      - logs:/app/logs
      - media_compartilhada:/app/media

    networks:
      - app_network

    depends_on:
      - rabbitmq

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  worker_pdf:
    image: davidnobrega/glot:latest

    command: celery -A core worker -Q pdf -l info --pool=prefork --concurrency=2

    environment:
      - PDF_ENGINE=${PDF_ENGINE:-weasyprint}

    volumes:
      - configuration:/app/configuration
      - logs:/app/logs
      - media_compartilhada:/app/media

    networks:
      - app_network

    depends_on:
      - rabbitmq

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  worker_mensagens:
    image: davidnobrega/glot:latest

    command: celery -A core worker -Q mensagens -l info --pool=prefork

    volumes:
      - configuration:/app/configuration
      - logs:/app/logs
      - media_compartilhada:/app/media

    networks:
      - app_network

    depends_on:
      - rabbitmq

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  beat:
    image: davidnobrega/glot:latest

    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

    volumes:
      - configuration:/app/configuration
      - logs:/app/logs
      - celerybeat:/app/celerybeat

    networks:
      - app_network

    depends_on:
      - rabbitmq

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  flower:
    image: davidnobrega/glot:latest

    command: celery -A core flower --port=5555

    ports:
      - "5555:5555"

    volumes:
      - configuration:/app/configuration
      - logs:/app/logs

    networks:
      - app_network

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  glot-backup:
    image: davidnobrega/glot-backup:latest

    # DB_HOST/PORT/NAME/B2_BACKUP_BUCKET_NAME/RETENTION_DAYS/NOTIFY_WEBHOOK_URL
    # vêm do mesmo configuration/.env que o serviço web já usa (ver
    # core/settings.py:35) — não duplicar aqui via ${VAR}, o Portainer não
    # repassa essas variáveis pro stack (só GIT_COMMIT/SENTRY_DSN/PDF_ENGINE).
    # DB_USER é fixo: NÃO reusar o DB_USER do .env (esse é o usuário admin do
    # Django) — glot_backup_ro é a role só-leitura dedicada (ver migration
    # accounts/0014).
    environment:
      - DB_USER=glot_backup_ro

    volumes:
      - configuration:/app/configuration:ro
      - glot_backup_logs:/var/log/glot-backup

    secrets:
      - source: glot_db_password
        target: db_password
      - source: b2_backup_key_id
        target: b2_backup_key_id
      - source: b2_backup_application_key
        target: b2_backup_application_key

    networks:
      - app_network

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  configuration:
    external: true

  logs:
    external: true

  media_compartilhada:
    external: true

  static_volume:
    external: true

  celerybeat:
    external: true

  glot_backup_logs:

networks:
  app_network:
    external: true

  npm_public:
    external: true

secrets:
  glot_db_password:
    external: true

  b2_backup_key_id:
    external: true

  b2_backup_application_key:
    external: true