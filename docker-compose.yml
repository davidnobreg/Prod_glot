version: "3.9"

services:

web:
image: davidnobrega/glot:latest

```
command: >
  /bin/sh -c "
  cd /app &&
  pip install --no-cache-dir -r requirements.txt &&
  python manage.py migrate &&
  python manage.py collectstatic --noinput --ignore=admin &&
  gunicorn core.wsgi:application
    --bind 0.0.0.0:8000
    --workers 4
    --timeout 120
  "

ports:
  - "8000:8000"

volumes:
  - configuration:/app/configuration
  - logs:/app/logs
  - media_compartilhada:/app/media
  - static_volume:/app/static

networks:
  - app_network
  - npm_public

depends_on:
  - postgres
  - rabbitmq

deploy:
  mode: replicated
  replicas: 1
  placement:
    constraints:
      - node.role == manager
  resources:
    limits:
      cpus: "0.50"
      memory: 512M
  restart_policy:
    condition: on-failure
```

worker_empreendimentos:
image: davidnobrega/glot:latest

```
command: >
  /bin/sh -c "
  cd /app &&
  pip install --no-cache-dir -r requirements.txt &&
  celery -A core worker -Q empreendimentos -l info
