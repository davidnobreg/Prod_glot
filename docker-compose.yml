version: "3.9"

services:
  db:
    image: postgres:16
    command: [postgres, --max_connections=100]
    networks:
      - app_network
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    #volumes:
     # - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: glot_new
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: glot2025
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    command: rabbitmq-server
    hostname: rabbitmq
    networks:
      - app_network
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      RABBITMQ_ERLANG_COOKIE: 'cnV34K:)tuvX6Q!51!VZxZHcQtvtFn'
      RABBITMQ_DEFAULT_VHOST: carlosecelsoimoveis
      RABBITMQ_DEFAULT_USER: carlosecelsoimoveis
      RABBITMQ_DEFAULT_PASS: M3CRexzgkEafveXjq3ZuuB20eswbAr 
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always
    #volumes:
    #  - rabbitmq_data:/var/lib/rabbitmq

  web:
    build: .
    image: davidnobrega/glot:latest
    command: /bin/sh -c "\
      cd /app && git pull || echo 'Falha no pull' && \
      pip install --no-cache-dir -r /app/requirements.txt && \
      python /app/manage.py runserver 0.0.0.0:8000"
    networks:
      - app_network
    depends_on:
      - db
      - rabbitmq
    ports:
      - "8000:8000"
    restart: always
    



networks:
  app_network:
    external: true