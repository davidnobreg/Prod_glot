name: Build e Deploy GLOT

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build e Deploy GLOT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/glot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/glot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}

      - name: Build e push da imagem glot-backup
        uses: docker/build-push-action@v5
        with:
          context: ./docker/backup
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/glot-backup:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/glot-backup:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy via API do Portainer
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
          GIT_COMMIT: ${{ github.sha }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PDF_ENGINE: ${{ vars.PDF_ENGINE }}
          DB_NAME: ${{ vars.DB_NAME }}
          GLOT_DB_PASSWORD: ${{ secrets.GLOT_DB_PASSWORD }}
          BACKUP_B2_KEY_ID: ${{ secrets.BACKUP_B2_KEY_ID }}
          BACKUP_B2_APPLICATION_KEY: ${{ secrets.BACKUP_B2_APPLICATION_KEY }}
        run: |
          set -e

          echo "Lendo stack file do repositório..."
          STACK_FILE_JSON=$(python3 -c "
          import json
          with open('Docker-compose.yml', 'r') as f:
              content = f.read()
          print(json.dumps(content))
          ")

          echo "Atualizando stack no Portainer..."
          RESPONSE=$(curl -s -o /tmp/portainer_response.json -w "%{http_code}" -X PUT \
            -H "X-API-Key: $PORTAINER_TOKEN" \
            -H "Content-Type: application/json" \
            "$PORTAINER_URL/api/stacks/9?endpointId=1" \
            -d "{
              \"stackFileContent\": $STACK_FILE_JSON,
              \"env\": [
                {\"name\": \"GIT_COMMIT\", \"value\": \"$GIT_COMMIT\"},
                {\"name\": \"SENTRY_DSN\",  \"value\": \"$SENTRY_DSN\"},
                {\"name\": \"PDF_ENGINE\",  \"value\": \"$PDF_ENGINE\"},
                {\"name\": \"DB_NAME\",     \"value\": \"$DB_NAME\"},
                {\"name\": \"GLOT_DB_PASSWORD\",       \"value\": \"$GLOT_DB_PASSWORD\"},
                {\"name\": \"BACKUP_B2_KEY_ID\",        \"value\": \"$BACKUP_B2_KEY_ID\"},
                {\"name\": \"BACKUP_B2_APPLICATION_KEY\",\"value\": \"$BACKUP_B2_APPLICATION_KEY\"}
              ],
              \"pullImage\": true,
              \"prune\": true
            }")

          echo "Status: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "Erro ao atualizar stack:"
            cat /tmp/portainer_response.json
            exit 1
          fi

          echo "Deploy concluído. Commit: $GIT_COMMIT"

      - name: Limpar imagens Docker antigas
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: docker image prune -a --force

      - name: Limpar tags antigas no Docker Hub
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e

          KEEP=5

          echo "Autenticando na API do Docker Hub..."
          DH_JWT=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKERHUB_USERNAME}\", \"password\": \"${DOCKERHUB_TOKEN}\"}" \
            | grep -oP '"token"\s*:\s*"\K[^"]+')

          if [ -z "$DH_JWT" ]; then
            echo "Falha ao autenticar na API do Docker Hub."
            exit 1
          fi

          for REPO in glot glot-backup; do
            echo "Processando repositório: ${DOCKERHUB_USERNAME}/${REPO}"

            TAGS=$(curl -s -H "Authorization: Bearer ${DH_JWT}" \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${REPO}/tags/?page_size=100&ordering=last_updated" \
              | grep -oP '"name"\s*:\s*"\K[^"]+' \
              | grep -v '^latest$')

            TOTAL=$(printf '%s\n' "$TAGS" | grep -c . || true)
            echo "  ${TOTAL} tags encontradas (mais antigas primeiro, 'latest' sempre preservada)"

            DELETE_COUNT=$((TOTAL - KEEP))
            if [ "$DELETE_COUNT" -le 0 ]; then
              echo "  Nada a deletar (<= ${KEEP} tags)."
              continue
            fi

            TAGS_TO_DELETE=$(printf '%s\n' "$TAGS" | head -n "$DELETE_COUNT")

            for TAG in $TAGS_TO_DELETE; do
              echo "  Deletando tag: ${TAG}"
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${DH_JWT}" \
                "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${REPO}/tags/${TAG}/")
              echo "    status: ${HTTP_CODE}"
            done
          done
