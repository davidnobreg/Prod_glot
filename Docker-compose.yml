version: "3.9"

services:
  web:
    image: davidnobrega/glot:latest

    ports:
      - "8000:8000"

    environment:
      - SENTRY_DSN=${SENTRY_DSN}
      - ENVIRONMENT=production
      - GIT_COMMIT=${GIT_COMMIT}
      - RUN_MIGRATIONS=true
      # Lida só pela migration accounts/0015 (ALTER ROLE glot_backup_ro
      # automático a cada migrate) — Django não usa isso em mais nada.
      - GLOT_DB_PASSWORD=${GLOT_DB_PASSWORD}

    volumes:
      - configuration:/app/configuration
      - logs:/app/logs
      - media_compartilhada:/app/media
      - static_volume:/app/static

    networks:
      - app_network
      - npm_public

    depends_on:
      - postgres
      - rabbitmq

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  worker_empreendimentos:
    image: davidnobrega/glot:latest

    command: celery -A core worker -Q empreendimentos,clientes -l info --pool=prefork

    volumes:
      - configuration:/app/configuration
      - logs:/app/logs
      - media_compartilhada:/app/media

    networks:
      - app_network

    depends_on:
      - rabbitmq

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  worker_pdf:
    image: davidnobrega/glot:latest

    command: celery -A core worker -Q pdf -l info --pool=prefork --concurrency=2

    environment:
      - PDF_ENGINE=${PDF_ENGINE:-weasyprint}

    volumes:
      - configuration:/app/configuration
      - logs:/app/logs
      - media_compartilhada:/app/media

    networks:
      - app_network

    depends_on:
      - rabbitmq

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  worker_mensagens:
    image: davidnobrega/glot:latest

    command: celery -A core worker -Q mensagens -l info --pool=prefork

    volumes:
      - configuration:/app/configuration
      - logs:/app/logs
      - media_compartilhada:/app/media

    networks:
      - app_network

    depends_on:
      - rabbitmq

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  beat:
    image: davidnobrega/glot:latest

    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

    volumes:
      - configuration:/app/configuration
      - logs:/app/logs
      - celerybeat:/app/celerybeat

    networks:
      - app_network

    depends_on:
      - rabbitmq

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  flower:
    image: davidnobrega/glot:latest

    command: celery -A core flower --port=5555

    ports:
      - "5555:5555"

    volumes:
      - configuration:/app/configuration
      - logs:/app/logs

    networks:
      - app_network

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  glot-backup:
    image: davidnobrega/glot-backup:latest

    # postgres17 é o mesmo host Swarm usado pelo DN Imob (Postgres
    # compartilhado, bancos diferentes). DB_USER fixo: NÃO trocar por
    # ${DB_USER} genérico — isso puxaria o usuário admin do Django. A role
    # glot_backup_ro é só-leitura (accounts/migrations/0014) e tem a senha
    # ativada automaticamente pela migration accounts/0015 a partir do mesmo
    # GLOT_DB_PASSWORD injetado no serviço web.
    environment:
      DB_HOST: postgres17
      DB_NAME: ${DB_NAME}
      DB_USER: glot_backup_ro
      DB_PASSWORD: ${GLOT_DB_PASSWORD}
      AWS_ACCESS_KEY_ID: ${BACKUP_B2_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_B2_APPLICATION_KEY}
      AWS_S3_ENDPOINT_URL: https://s3.us-east-005.backblazeb2.com
      AWS_DEFAULT_REGION: us-east-005
      BACKUP_BUCKET: glot-db-backups-prod

    networks:
      - app_network

    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

volumes:
  configuration:
    external: true

  logs:
    external: true

  media_compartilhada:
    external: true

  static_volume:
    external: true

  celerybeat:
    external: true

networks:
  app_network:
    external: true

  npm_public:
    external: true