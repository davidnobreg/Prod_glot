{% load static %}

<!DOCTYPE html>

<html
    lang="pt-br"
    dir="ltr"
    data-nav-layout="vertical"
    data-header-styles="dark"
    loader="disable"
    data-menu-styles="dark"
    data-toggled="close"
>

<head>

    <meta charset="UTF-8">

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no"
    >

    <title>
        {% block title %}
        {% endblock %}
    </title>

    <!-- ===================================================== -->
    <!-- FAVICON -->
    <!-- ===================================================== -->

    <link
        rel="icon"
        href="{% static 'favicon.ico' %}"
        type="image/x-icon"
    >

    <!-- ===================================================== -->
    <!-- BOOTSTRAP -->
    <!-- ===================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ===================================================== -->
    <!-- BOOTSTRAP ICONS -->
    <!-- ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- ===================================================== -->
    <!-- FONT AWESOME -->
    <!-- ===================================================== -->

    <script
        src="https://kit.fontawesome.com/f0b6e7054e.js"
        crossorigin="anonymous"
    ></script>

    <!-- ===================================================== -->
    <!-- SELECT2 -->
    <!-- ===================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
        rel="stylesheet"
    >

    <!-- ===================================================== -->
    <!-- FLATPICKR -->
    <!-- ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    >

    <!-- ===================================================== -->
    <!-- CUSTOM CSS -->
    <!-- ===================================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

    <!-- ===================================================== -->
    <!-- CUSTOM STYLE -->
    <!-- ===================================================== -->

    <style>

        body {

            background-color: #f5f7fb;

        }

        .card {

            border-radius: 16px;

        }

        .form-control,
        .select2-container .select2-selection--single {

            height: 48px;

            border-radius: 12px;

        }

        .money-readonly {

            background-color: #edf2f7 !important;

            font-weight: 600;

            color: #0d6efd;

        }

        .resumo-financeiro {

            background: linear-gradient(
                135deg,
                #0d6efd,
                #0b5ed7
            );

            color: white;

            border-radius: 18px;

        }

        .resumo-financeiro strong {

            font-size: 1.1rem;

        }

        .flatpickr-input[readonly] {

            background-color: #fff !important;

            cursor: pointer;

        }

    </style>

    <!-- ===================================================== -->
    <!-- SESSION TIMER -->
    <!-- ===================================================== -->

    <script>

        const sessionAge = {{ request.session.get_expiry_age|default:900 }};

        let timeLeft = sessionAge;

        function startSessionTimer() {

            const warningTime = 60;

            const interval = setInterval(() => {

                timeLeft--;

                if (timeLeft === warningTime) {

                    alert(
                        "⚠️ Sua sessão expirará em 1 minuto."
                    );

                }

                if (timeLeft <= 0) {

                    clearInterval(interval);

                    alert(
                        "Sua sessão expirou."
                    );

                    window.location.href = "{% url 'logout' %}";

                }

            }, 1000);

        }

        document.addEventListener(
            "DOMContentLoaded",
            startSessionTimer
        );

    </script>

</head>

<body>

<!-- ========================================================= -->
<!-- NAVBAR -->
<!-- ========================================================= -->

{% include 'navbar.html' %}

<!-- ========================================================= -->
<!-- MESSAGES -->
<!-- ========================================================= -->

{% include 'message.html' %}

<!-- ========================================================= -->
<!-- CONTENT -->
<!-- ========================================================= -->

<div class="container-fluid py-4">

    {% block content %}
    {% endblock %}

</div>

<!-- ========================================================= -->
<!-- FOOTER -->
<!-- ========================================================= -->

<footer>

    {% include 'rodape.html' %}

</footer>

<!-- ========================================================= -->
<!-- JQUERY -->
<!-- ========================================================= -->

<script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
></script>

<!-- ========================================================= -->
<!-- BOOTSTRAP -->
<!-- ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<!-- ========================================================= -->
<!-- SELECT2 -->
<!-- ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"
></script>

<!-- ========================================================= -->
<!-- FLATPICKR -->
<!-- ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/flatpickr"
></script>

<script
    src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"
></script>

<!-- ========================================================= -->
<!-- HTML2CANVAS -->
<!-- ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
></script>

<!-- ========================================================= -->
<!-- CUSTOM JS -->
<!-- ========================================================= -->

<script src="{% static 'js/jquery.mask.min.js' %}"></script>

<script src="{% static 'js/empreendimento.js' %}"></script>

<script src="{% static 'js/geral.js' %}"></script>

<script src="{% static 'js/cliente.js' %}"></script>

<script src="{% static 'js/cep.js' %}"></script>

<script src="{% static 'js/conjuge.js' %}"></script>

<script src="{% static 'js/telefone.js' %}"></script>

<!-- ========================================================= -->
<!-- GLOBAL INIT -->
<!-- ========================================================= -->

<script>

    $(document).ready(function () {

        // =====================================================
        // SELECT2
        // =====================================================

        $('.select2').select2({

            placeholder: 'Selecione',

            allowClear: true,

            width: '100%'

        });

        // =====================================================
        // MASK MONEY
        // =====================================================

        $('.mask-money').mask(

            '#.##0,00',

            {

                reverse: true

            }

        );

        // =====================================================
        // FLATPICKR
        // =====================================================

        flatpickr('.datepicker', {

            locale: 'pt',

            altInput: true,

            altFormat: 'd/m/Y',

            dateFormat: 'Y-m-d',

            minDate: 'today',

            allowInput: false,

            disableMobile: true

        });

    });

</script>

</body>

</html>
