{% extends 'base.html' %}
{% block title %}Novo distrato{% endblock %}
{% block content %}
<div class="container-fluid px-3">
	<h5 class="mb-3">Novo distrato — Venda #{{ venda.id }} ({{ venda.cliente.name }})</h5>
	<div class="card shadow-sm" style="max-width:640px;">
		<div class="card-body">
			<form method="post">
				{% csrf_token %}
				<div class="mb-3">
					<label class="form-label small">Motivo</label>
					<textarea name="motivo" class="form-control form-control-sm" rows="3" required></textarea>
				</div>
				<div class="row g-2">
					<div class="col-md-4">
						<label class="form-label small">Data do distrato</label>
						<input type="date" name="data_distrato" class="form-control form-control-sm" required>
					</div>
					<div class="col-md-4">
						<label class="form-label small">Valor devolução</label>
						<input type="number" step="0.01" name="valor_devolucao" class="form-control form-control-sm" value="0">
					</div>
					<div class="col-md-4">
						<label class="form-label small">% retenção</label>
						<input type="number" step="0.01" name="percentual_retencao" class="form-control form-control-sm" value="0">
					</div>
				</div>
				<div class="mb-3 mt-2">
					<label class="form-label small">Observação</label>
					<textarea name="observacao" class="form-control form-control-sm" rows="2"></textarea>
				</div>
				<button class="btn btn-success btn-sm rounded-pill"><i class="bi bi-save me-1"></i>Salvar distrato</button>
			</form>
		</div>
	</div>
</div>
{% endblock %}
