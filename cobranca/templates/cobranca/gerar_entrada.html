{% extends 'base.html' %}
{% load static %}

{% block title %}Gerar Entrada{% endblock %}

{% block content %}
    <div class="card m-3" style="max-width: 520px;">
        <div class="card-header">
            <h5 class="mb-0">Gerar Entrada — {{ venda.cliente.name }}</h5>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Valor</label>
                    <input type="text" name="valor" class="form-control" placeholder="0,00" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Data de vencimento</label>
                    <input type="date" name="data_vencimento" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Modalidade</label>
                    <select name="modalidade" class="form-select">
                        {% for valor, label in modalidade_choices %}
                            <option value="{{ valor }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <a href="{% url 'lista_carnes_venda' venda.uuid %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Gerar Entrada</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
