name: Build e Deploy GLOT

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/glot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/glot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy via API do Portainer
        run: |
          set -e

          echo "Obtendo docker-compose da stack..."

          STACK_FILE=$(curl -s \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            "${{ secrets.PORTAINER_URL }}/api/stacks/48/file" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['StackFileContent'])")

          STACK_FILE_JSON=$(echo "$STACK_FILE" | python3 -c \
            "import sys,json; print(json.dumps(sys.stdin.read()))")

          echo "Atualizando stack com pullImage e prune..."

          RESPONSE=$(curl -s -o /tmp/portainer_response.json -w "%{http_code}" -X PUT \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.PORTAINER_URL }}/api/stacks/48?endpointId=1" \
            -d "{
              \"stackFileContent\": $STACK_FILE_JSON,
              \"env\": [],
              \"pullImage\": true,
              \"prune\": true
            }")

          echo "Status PUT stack: $RESPONSE"
          cat /tmp/portainer_response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Erro ao atualizar stack. Status: $RESPONSE"
            exit 1
          fi

          echo "Forçando redeploy dos serviços..."

          # Reinicia cada serviço individualmente para forçar pull da nova imagem
          for SERVICE in web worker_empreendimentos worker_mensagens beat flower; do
            echo "Reiniciando serviço: $SERVICE"

            # Busca o ID do serviço pelo nome
            SERVICE_ID=$(curl -s \
              -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
              "${{ secrets.PORTAINER_URL }}/api/endpoints/1/docker/services" | \
              python3 -c "
  import sys, json
  services = json.load(sys.stdin)
  name = 'django_glot_$SERVICE'
for s in services:
  if s.get('Spec', {}).get('Name', '') == name:
    print(s['ID'])
    break
  ")

            if [ -z "$SERVICE_ID" ]; then
  echo "⚠️ Serviço $SERVICE não encontrado, pulando..."
  continue
  fi

echo "ID do serviço $SERVICE: $SERVICE_ID"

# Busca spec atual do serviço
  SERVICE_SPEC=$(curl -s \
-H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
  "${{ secrets.PORTAINER_URL }}/api/endpoints/1/docker/services/$SERVICE_ID")
  
  VERSION=$(echo "$SERVICE_SPEC" | python3 -c "import sys,json; print(json.load(sys.stdin)['Version']['Index'])")
  SPEC=$(echo "$SERVICE_SPEC" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d['Spec']))")
  
  # Força update incrementando ForceUpdate
  FORCE_SPEC=$(echo "$SPEC" | python3 -c "
  import sys, json
  spec = json.load(sys.stdin)
  spec.setdefault('TaskTemplate', {})
  spec['TaskTemplate']['ForceUpdate'] = spec['TaskTemplate'].get('ForceUpdate', 0) + 1
  print(json.dumps(spec))
  ")

            UPDATE_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
-H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
-H "Content-Type: application/json" \
  "${{ secrets.PORTAINER_URL }}/api/endpoints/1/docker/services/$SERVICE_ID/update?version=$VERSION" \
  -d "$FORCE_SPEC")

echo "Status update $SERVICE: $UPDATE_RESPONSE"
  done
  
  echo "✅ Deploy e reinício dos serviços concluído!"